# Dart 包标识，需与 import package 名一致。
name: flutter_app_framework
# 框架用途说明，供包与工程元数据使用。
description: Flutter APP 通用框架，支持 Android 和 iOS。
# 目标为应用工程，禁止误发布到公共包仓。
publish_to: none
# 用户版本与构建号，Android/iOS 原生配置共同读取。
version: 1.0.0+1
# 当前源码使用的 Dart SDK 约束，不在本次注释治理中升级。
environment:
  sdk: ^3.8.1
# 应用运行依赖；版本解析结果由 pubspec.lock 锁定。
dependencies:
  flutter:
    sdk: flutter
  # Material 组件的中文及英文系统文案。
  flutter_localizations:
    sdk: flutter
  # 头像远程图片缓存、占位与失败回退。
  cached_network_image: ^3.4.1
  # HTTP 传输、超时和取消，业务信封由调用方解码。
  dio: ^5.8.0+1
  # 依赖容器、主题状态和动作锁。
  flutter_riverpod: ^2.6.1
  # 统一三点加载动画。
  flutter_spinkit: ^5.2.2
  # 保留状态的分支导航和未知路由回退。
  go_router: ^15.1.3
  # 非敏感外观偏好，不能保存会话凭证。
  shared_preferences: ^2.5.3
  # Android Keystore/iOS Keychain 凭证后端。
  flutter_secure_storage: 9.2.4
  # 设备连接类型事件，不保证互联网可达。
  connectivity_plus: ^6.1.4
  # 受来源限制的原生网页容器。
  webview_flutter: ^4.13.0
# 仅开发与回归验证使用的依赖。
dev_dependencies:
  # 组件树、虚拟时间及单元测试工具。
  flutter_test:
    sdk: flutter
  # 基础 Dart/Flutter 静态检查规则。
  flutter_lints: ^5.0.0
  # WebView 测试的平台替身接口，避免连接真实网页。
  webview_flutter_platform_interface: 2.14.0
flutter:
  # 将 Material 图标字体包含在应用资源中。
  uses-material-design: true
  # 中性可变中文字体，AppTheme 同步设置 wght 字重轴。
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable.ttf

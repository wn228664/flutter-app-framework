name: flutter_app_framework
description: Flutter APP 通用框架，支持 Android 和 iOS。
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  flutter_spinkit: ^5.2.2
  go_router: ^15.1.3
  shared_preferences: ^2.5.3
  flutter_secure_storage: 9.2.4
  connectivity_plus: ^6.1.4
  webview_flutter: ^4.13.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  webview_flutter_platform_interface: 2.14.0
flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable.ttf
